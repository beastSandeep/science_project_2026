<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Orbital Ring 1: Horizontal tilted -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="url(#cyanGrad)" stroke-width="2" transform="rotate(-30 32 32)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Orbital Ring 2: Tilted opposite -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="url(#violetGrad)" stroke-width="2" transform="rotate(30 32 32)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Orbital Ring 3: Vertical axis -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(90 32 32)" opacity="0.75"/>

  <!-- Electron 1 -->
  <circle cx="48" cy="23" r="2.5" fill="#22d3ee" filter="url(#glow)"/>
  <!-- Electron 2 -->
  <circle cx="16" cy="23" r="2.5" fill="#a855f7" filter="url(#glow)"/>
  <!-- Electron 3 -->
  <circle cx="32" cy="53" r="2" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Central Atomic Nucleus with Core Glow -->
  <circle cx="32" cy="32" r="6" fill="#0891b2" opacity="0.4" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4.5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="30.5" cy="30.5" r="1.5" fill="#ffffff"/>
</svg>
